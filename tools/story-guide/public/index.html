<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Story Guide</title>
    <style>
      :root {
        --page: #fbf8f2;
        --surface: #ffffff;
        --ink: #1c1a17;
        --muted: #5c564c;
        --line: #ddd5c4;
        --accent: #8a3b12;
        --accent-ink: #ffffff;
        --bad: #a3261a;
        --good: #2c6b3f;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page: #1b1c1f;
          --surface: #26282c;
          --ink: #e7e3da;
          --muted: #aaa69c;
          --line: #3a3d42;
          --accent: #e3a86f;
          --accent-ink: #1b1c1f;
          --bad: #ff8f84;
          --good: #7fcf95;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--page);
        color: var(--ink);
        font:
          16px/1.5 system-ui,
          sans-serif;
      }
      main {
        max-width: 64rem;
        margin: 0 auto;
        padding: 1.5rem 1rem 4rem;
      }
      h1 {
        font-family: Georgia, serif;
        margin: 0 0 0.25rem;
      }
      h2 {
        font-size: 1.1rem;
        margin: 0 0 0.5rem;
      }
      .muted {
        color: var(--muted);
      }
      .banner {
        border: 2px solid var(--bad);
        border-radius: 0.5rem;
        padding: 0.75rem 1rem;
        margin: 1rem 0;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 0.75rem;
        padding: 1rem;
        margin: 1rem 0;
      }
      label {
        display: block;
        font-weight: 600;
        margin: 0.75rem 0 0.25rem;
      }
      input,
      select,
      textarea {
        width: 100%;
        font: inherit;
        color: inherit;
        background: var(--page);
        border: 1px solid var(--line);
        border-radius: 0.4rem;
        padding: 0.5rem;
      }
      textarea {
        min-height: 9rem;
      }
      button {
        font: inherit;
        font-weight: 600;
        background: var(--accent);
        color: var(--accent-ink);
        border: 0;
        border-radius: 999px;
        padding: 0.6rem 1.4rem;
        cursor: pointer;
        margin-top: 1rem;
      }
      button:disabled {
        opacity: 0.5;
        cursor: wait;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .cols {
        display: grid;
        gap: 1rem;
        grid-template-columns: 1fr 1fr;
      }
      @media (max-width: 700px) {
        .cols {
          grid-template-columns: 1fr;
        }
      }
      .field {
        margin: 0 0 1rem;
      }
      .field h3 {
        font-size: 0.8rem;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 0 0.2rem;
      }
      .chip {
        display: inline-block;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 0 0.6rem;
        margin: 0 0.25rem 0.25rem 0;
      }
      .bad {
        color: var(--bad);
      }
      .good {
        color: var(--good);
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      td {
        padding: 0.15rem 0.5rem 0.15rem 0;
        border-bottom: 1px solid var(--line);
      }
      .row {
        display: flex;
        gap: 0.5rem;
        align-items: center;
      }
      button.small {
        margin-top: 0;
        white-space: nowrap;
      }
      .gresults {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .gresults li {
        display: flex;
        gap: 0.75rem;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--line);
        padding: 0.35rem 0;
      }
      .gresults button {
        margin: 0;
        padding: 0.3rem 1rem;
      }
      .picked {
        border: 2px solid var(--accent);
        border-radius: 0.5rem;
        padding: 0.5rem 0.75rem;
        margin: 0.5rem 0;
      }
      .picked p {
        margin: 0.25rem 0;
      }
      a {
        color: var(--accent);
      }
      td.reason {
        font-size: 0.9rem;
        padding: 0 0 0.35rem 1rem;
      }
      .note {
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Story Guide</h1>
      <p class="muted">
        Gemma reads a story and suggests a hook, a blurb, moods, content notes
        and an age band. A local tool: nothing here is part of the app.
      </p>
      <div id="banner" class="banner" role="alert" hidden></div>

      <section class="card" aria-labelledby="pick-title">
        <h2 id="pick-title">1. Choose a story</h2>
        <label for="search">Find a catalog story</label>
        <input id="search" type="search" placeholder="Title or author" />
        <label for="story">Catalog story</label>
        <select id="story"></select>
        <p class="muted" id="count"></p>

        <label for="gsearch">Or search Project Gutenberg</label>
        <div class="row">
          <input
            id="gsearch"
            type="search"
            placeholder="Title or author, e.g. The Open Window"
          />
          <button id="gsearch-go" type="button" class="small">Search</button>
        </div>
        <p id="gstatus" role="status" class="muted"></p>
        <ul id="gresults" class="gresults"></ul>
        <div id="gpicked" class="picked" hidden></div>

        <label for="pasted">Or paste a story (at least 150 words)</label>
        <textarea
          id="pasted"
          placeholder="Paste the story text here"
        ></textarea>
        <label for="pasted-title">Title for pasted text (optional)</label>
        <input id="pasted-title" type="text" />

        <button id="go" type="button">Ask Gemma</button>
        <p id="status" role="status" class="muted"></p>
      </section>

      <div id="results" aria-live="polite"></div>
    </main>

    <script>
      const $ = (id) => document.getElementById(id)
      const el = (tag, props = {}, ...kids) => {
        const node = document.createElement(tag)
        Object.assign(node, props)
        for (const kid of kids) node.append(kid)
        return node
      }
      // Model text is always shown with textContent, never as HTML.
      const field = (heading, ...kids) =>
        el(
          'div',
          { className: 'field' },
          el('h3', { textContent: heading }),
          ...kids,
        )
      const text = (s, className = '') => el('p', { textContent: s, className })

      let stories = []
      let keySet = false

      async function loadStatus() {
        const status = await (await fetch('/api/status')).json()
        keySet = status.keySet
        const banner = $('banner')
        const problems = []
        if (!status.keySet)
          problems.push(
            'GEMINI_API_KEY is missing. Copy tools/story-guide/.env.example to tools/story-guide/.env, add your key, and restart the tool.',
          )
        if (!status.catalogReady)
          problems.push(
            'The catalog could not be built (' +
              status.catalogError +
              '). You can still paste text.',
          )
        banner.textContent = problems.join(' ')
        banner.hidden = problems.length === 0
        $('go').disabled = !status.keySet
        return status
      }

      function fillStories() {
        const q = $('search').value.trim().toLowerCase()
        const shown = stories.filter((s) =>
          (s.title + ' ' + s.author).toLowerCase().includes(q),
        )
        const select = $('story')
        const previous = select.value
        if (shown.length === 0) {
          select.replaceChildren(
            el('option', { value: '', textContent: 'No matches' }),
          )
          select.value = ''
          $('count').textContent = 'No matches'
          return
        }
        // While searching, the list holds only the matches and the first one is selected.
        // With an empty search, the "(none)" choice comes back and a story picked earlier stays.
        select.replaceChildren(
          ...(q === ''
            ? [
                el('option', {
                  value: '',
                  textContent: '(none: use pasted text)',
                }),
              ]
            : []),
          ...shown.map((s) =>
            el('option', {
              value: s.id,
              textContent:
                s.title + ' — ' + s.author + ' · ' + s.minutes + ' min',
            }),
          ),
        )
        select.value =
          q !== ''
            ? shown[0].id
            : shown.some((s) => s.id === previous)
              ? previous
              : ''
        $('count').textContent =
          shown.length + ' of ' + stories.length + ' stories'
      }

      function checkLine(label, c) {
        if (c.ok)
          return text(
            label +
              ': ' +
              c.words +
              ' of ' +
              c.limit +
              ' words. Passes the banned-words and 6-word-quote checks.',
            'good',
          )
        const problems = []
        if (c.overLimit)
          problems.push(c.words + ' words, over the limit of ' + c.limit)
        if (c.banned.length)
          problems.push(
            'banned: ' + c.banned.map((w) => '"' + w + '"').join(', '),
          )
        if (c.copied)
          problems.push('copies six words from the story: "' + c.copied + '"')
        return text(label + ' FAILS: ' + problems.join('; '), 'bad')
      }

      function notesTable(gemma) {
        const rows = []
        for (const [kind, note] of Object.entries(gemma.contentNotes)) {
          rows.push(
            el(
              'tr',
              {},
              el('td', { textContent: kind }),
              el('td', {
                textContent: note.level ?? 'unclear',
                className: note.level === 'strong' ? 'bad' : '',
              }),
            ),
          )
          // A reason appears only under a mild or strong note.
          if (note.reason)
            rows.push(
              el(
                'tr',
                {},
                el('td', {
                  colSpan: 2,
                  className: 'reason muted',
                  textContent: note.reason,
                }),
              ),
            )
        }
        return el('table', {}, ...rows)
      }

      function chips(list) {
        if (!list || list.length === 0) return text('none', 'muted')
        return el(
          'div',
          {},
          ...list.map((m) => el('span', { className: 'chip', textContent: m })),
        )
      }

      function show(r) {
        const out = $('results')
        const g = r.gemma
        const gemmaCol = el(
          'section',
          { className: 'card' },
          el('h2', { textContent: 'Gemma (' + r.model + ')' }),
          field('Hook', text(g.hook)),
          field(
            'Blurb',
            text(g.blurb),
            text(
              'Gemma wrote this blurb without seeing the ending.',
              'note muted',
            ),
            text(
              'Written from the first ' +
                r.opening.words +
                ' of ' +
                r.opening.totalWords +
                ' words.',
              'muted',
            ),
          ),
          field(
            'Moods',
            chips(g.moods),
            g.droppedMoods.length
              ? text(
                  'Not in the catalog list, dropped: ' +
                    g.droppedMoods.join(', '),
                  'bad',
                )
              : el('span'),
          ),
          field('Content notes', notesTable(g)),
          field(
            'Age band',
            text(g.ageBand ?? 'unclear'),
            text(g.ageReason, 'muted'),
            r.checks.ageReason.words > r.checks.ageReason.limit
              ? text(
                  'Age reason is ' +
                    r.checks.ageReason.words +
                    ' words, over the limit of ' +
                    r.checks.ageReason.limit +
                    '.',
                  'bad',
                )
              : el('span'),
          ),
        )
        const c = r.curated
        const curatedCol = el(
          'section',
          { className: 'card' },
          el('h2', { textContent: 'Curated (in the catalog)' }),
          c
            ? el(
                'div',
                {},
                field('Hook', text(c.hook)),
                field('Blurb', text(c.blurb)),
                field('Moods', chips(c.moods)),
                field('Content notes', chips(c.contentNotes)),
                field(
                  'Review',
                  text(
                    c.review === 'human'
                      ? 'Read by a person'
                      : 'Checked by automated checks only',
                    'muted',
                  ),
                ),
              )
            : r.source && r.source.kind === 'gutenberg'
              ? text(
                  r.source.inCatalog.length
                    ? inCatalogNote(r.source.inCatalog)
                    : 'Not in the Dog-Eared Tales catalog',
                  'muted',
                )
              : text('Pasted text has no curated version.', 'muted'),
        )
        const checks = el(
          'section',
          { className: 'card' },
          el('h2', { textContent: 'Checks on Gemma’s hook and blurb' }),
          checkLine('Hook', r.checks.hook),
          checkLine('Blurb', r.checks.blurb),
          g.retried
            ? text(
                'One reply was not valid JSON, so Gemma was asked again.',
                'muted',
              )
            : el('span'),
        )
        out.replaceChildren(
          el('h2', { textContent: r.label }),
          ...(r.source && r.source.kind === 'gutenberg'
            ? [
                el(
                  'p',
                  {},
                  el('span', {
                    textContent:
                      'Project Gutenberg: ' +
                      r.source.title +
                      ' by ' +
                      r.source.author +
                      '. ',
                  }),
                  gutenbergLink(r.source.id),
                ),
                r.source.truncated
                  ? text(
                      'Only the first ' +
                        r.source.limit.toLocaleString() +
                        ' of ' +
                        r.source.totalWords.toLocaleString() +
                        ' words were analysed; the blurb uses the first third of those.',
                      'bad',
                    )
                  : el('span'),
              ]
            : []),
          el('div', { className: 'cols' }, gemmaCol, curatedCol),
          checks,
        )
      }

      // Project Gutenberg: the page only talks to this server, never to Gutendex or Gutenberg.
      let gutenbergPick = null
      const gutenbergLink = (id) =>
        el('a', {
          href: 'https://www.gutenberg.org/ebooks/' + Number(id),
          target: '_blank',
          rel: 'noopener noreferrer',
          textContent: 'View on Project Gutenberg',
        })
      const limitNote = (b) =>
        'This book has ' +
        b.totalWords.toLocaleString() +
        ' words. Only the first ' +
        b.limit.toLocaleString() +
        ' words will be analysed; the blurb is written from the first third of those.'

      const inCatalogNote = (titles) =>
        'This book is already in the Dog-Eared Tales catalog (' +
        titles.slice(0, 3).join(', ') +
        (titles.length > 3 ? ', …' : '') +
        '). Pick it from the catalog list to compare with the curated version.'

      function clearPick() {
        gutenbergPick = null
        $('gpicked').hidden = true
        $('gpicked').replaceChildren()
      }

      async function searchGutenberg() {
        const q = $('gsearch').value.trim()
        const status = $('gstatus')
        status.className = 'muted'
        if (!q) return
        $('gresults').replaceChildren()
        status.textContent = 'Searching Project Gutenberg…'
        try {
          const response = await fetch(
            '/api/gutenberg/search?q=' + encodeURIComponent(q),
          )
          const data = await response.json()
          if (!response.ok) throw new Error(data.error || 'Search failed.')
          status.textContent = data.length
            ? ''
            : 'No matches on Project Gutenberg.'
          $('gresults').replaceChildren(
            ...data.map((b) =>
              el(
                'li',
                {},
                el('span', {
                  textContent:
                    b.title +
                    ' — ' +
                    b.author +
                    ' · #' +
                    b.id +
                    ' · ' +
                    b.downloads.toLocaleString() +
                    ' downloads',
                }),
                el('button', {
                  type: 'button',
                  textContent: 'Use',
                  onclick: () => pickBook(b),
                }),
              ),
            ),
          )
        } catch (error) {
          status.className = 'bad'
          status.textContent = error.message
        }
      }

      async function pickBook(b) {
        const status = $('gstatus')
        status.className = 'muted'
        status.textContent = 'Downloading “' + b.title + '”…'
        try {
          const response = await fetch('/api/gutenberg/book/' + Number(b.id))
          const data = await response.json()
          if (!response.ok) throw new Error(data.error || 'Download failed.')
          status.textContent = ''
          gutenbergPick = data
          $('story').value = ''
          $('pasted').value = ''
          const box = $('gpicked')
          box.replaceChildren(
            el('p', {
              textContent:
                'Selected: ' +
                data.title +
                ' — ' +
                data.author +
                ' · ' +
                data.totalWords.toLocaleString() +
                ' words',
            }),
            el('p', {}, gutenbergLink(data.id)),
            data.inCatalog.length
              ? text(inCatalogNote(data.inCatalog), 'muted')
              : el('span'),
            data.truncated
              ? el('p', { className: 'bad', textContent: limitNote(data) })
              : el('span'),
          )
          box.hidden = false
        } catch (error) {
          status.className = 'bad'
          status.textContent = error.message
        }
      }

      async function analyze() {
        const go = $('go')
        const id = $('story').value
        const pasted = $('pasted').value
        go.disabled = true
        $('status').textContent =
          'Asking Gemma (two calls, this can take a minute)…'
        $('results').replaceChildren()
        try {
          const body = gutenbergPick
            ? { gutenbergId: gutenbergPick.id }
            : id
              ? { id }
              : { text: pasted, title: $('pasted-title').value }
          const response = await fetch('/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          })
          const data = await response.json()
          if (!response.ok)
            throw new Error(data.error || 'Something went wrong.')
          $('status').textContent = ''
          show(data)
        } catch (error) {
          $('status').textContent = ''
          $('results').replaceChildren(
            el('div', {
              className: 'banner',
              role: 'alert',
              textContent: error.message,
            }),
          )
        } finally {
          go.disabled = !keySet
        }
      }

      $('search').addEventListener('input', () => {
        clearPick()
        fillStories()
      })
      $('story').addEventListener('change', clearPick)
      $('pasted').addEventListener('input', clearPick)
      $('gsearch-go').addEventListener('click', searchGutenberg)
      $('gsearch').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') searchGutenberg()
      })
      $('go').addEventListener('click', analyze)
      ;(async () => {
        await loadStatus()
        stories = await (await fetch('/api/stories')).json()
        fillStories()
      })().catch((error) => {
        $('banner').textContent = 'Could not reach the tool: ' + error.message
        $('banner').hidden = false
      })
    </script>
  </body>
</html>
